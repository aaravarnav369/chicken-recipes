<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Automated Blog</title>
    <meta name="description" content="A static blog powered by JSON content">
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1 class="site-title">My Automated Blog</h1>
            <p class="site-tagline">Where content meets automation</p>
            <nav class="nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Categories</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div id="adsense-top" class="adsense-placeholder">
                <!-- AdSense Top Placeholder -->
            </div>
            
            <section class="posts-grid" id="posts-container">
                <!-- Posts will be rendered here by JavaScript -->
            </section>
            
            <div id="adsense-bottom" class="adsense-placeholder">
                <!-- AdSense Bottom Placeholder -->
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2025 My Automated Blog. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/render.js"></script>
</body>
</html>
